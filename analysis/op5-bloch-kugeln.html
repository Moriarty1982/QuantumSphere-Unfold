<div id="op5-bloch">
  <h2>Was die Bloch-Kugeln vom Restfehler zeigen</h2>
  <div class="viz-controls">
    <label class="form-label">Geprüfter Punkt, N = 16
      <select class="form-select" id="op5-point">
        <option value="0">P₁: t = 1; x = 0,6; y = z = 0</option>
        <option value="1" selected>P₂: t = 1; x = 0,4; y = z = 0,2</option>
      </select>
    </label>
  </div>
  <div class="op5-spheres">
    <section><h3>Ruhespin</h3><svg id="op5-spin" role="img" aria-label="Bloch-Kugel: A und B mit gleicher Spinrichtung, C entgegengesetzt"></svg><div class="text-small">● A/B &nbsp; ◆ C · fehlende Spindrehung ≈ 0</div></section>
    <section><h3>A/B-Mischung</h3><svg id="op5-mix" role="img" aria-label="Bloch-Kugel der A/B-Mischung mit fehlender tangentialer Änderung"></svg><div id="op5-mix-detail" class="text-small" aria-live="polite"></div></section>
  </div>
  <h3>Verteilung der quadrierten Restnorm</h3>
  <div id="op5-bars" role="img" aria-label="Anteile des Restfehlers bei festgehaltenem Boost"></div>
  <div class="text-small text-muted">Lokale Zerlegung · fester Boost · gewählte Spinorphase · keine Wahrscheinlichkeiten</div>
</div>
<style>
#op5-bloch .op5-spheres {display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin:16px 0 24px}
#op5-bloch svg {display:block;width:100%;height:270px;overflow:visible}
#op5-bloch svg text {fill:var(--foreground);font-size:12px}
#op5-bloch .op5-row {margin:12px 0}
#op5-bloch .op5-bar-label {display:flex;justify-content:space-between;gap:12px;margin-bottom:5px}
#op5-bloch .op5-track {height:12px;background:color-mix(in srgb,var(--foreground) 7%,transparent)}
#op5-bloch .op5-fill {height:100%;background:var(--viz-series-1)}
@media (prefers-reduced-motion:no-preference){#op5-bloch .op5-fill{transition:width .25s ease}}
</style>
<script>
(() => {
 const root=document.getElementById('op5-bloch');
 const select=root.querySelector('#op5-point');
 const datasets=[
  {spin:[0,1,0],mix:[.5,0,Math.sqrt(3)/2],dm:[0,0,0],parts:[0,0,100]},
  {spin:[-1/Math.sqrt(5),2/Math.sqrt(5),0],mix:[.5,0,Math.sqrt(3)/2],dm:[0,-.7745966692414834,0],parts:[5.338018473859747,0,94.66198152614025]}
 ];
 const ns='http://www.w3.org/2000/svg';
 function el(name,attrs,parent,text){const e=document.createElementNS(ns,name);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));if(text!==undefined)e.textContent=text;parent.appendChild(e);return e;}
 function sphere(svg,kind,data){
  svg.replaceChildren();const width=Math.max(260,svg.getBoundingClientRect().width);svg.setAttribute('viewBox',`0 0 ${width} 270`);
  const cx=width/2,cy=136,R=Math.min(91,(width-80)/2);
  const project=v=>[cx+R*(Math.sqrt(3)/2*v[0]-.5*v[1]),cy-R*(.25*v[0]+Math.sqrt(3)/4*v[1]+Math.sqrt(3)/2*v[2])];
  const title=el('title',{},svg,kind==='spin'?'Ruhespin: A/B und C antipodal; keine fehlende Spindrehung im getesteten Unterraum.':'A/B-Mischung: Punkt (0,5; 0; 0,866). Der Pfeil zeigt die fehlende Phasenänderung, keine integrierte Bahn.');
  el('circle',{cx,cy,r:R,fill:'none',stroke:'var(--border)','stroke-width':1},svg);
  for(let plane=0;plane<3;plane++){
   let path='';for(let k=0;k<=100;k++){const angle=k*2*Math.PI/100,v=[0,0,0];v[(plane+1)%3]=Math.cos(angle);v[(plane+2)%3]=Math.sin(angle);const p=project(v);path+=(k?'L':'M')+p.join(',');}
   el('path',{d:path,fill:'none',stroke:'var(--border)','stroke-width':1},svg);
  }
  ['x','y','z'].forEach((label,i)=>{const v=[0,0,0];v[i]=1.16;const p=project(v);el('line',{x1:cx,y1:cy,x2:p[0],y2:p[1],stroke:'var(--border)','stroke-width':1},svg);el('text',{x:p[0]+4,y:p[1]+4},svg,label);});
  function mark(v,color,label,shape){const p=project(v);el('line',{x1:cx,y1:cy,x2:p[0],y2:p[1],stroke:color,'stroke-width':2},svg);if(shape==='diamond')el('path',{d:`M${p[0]},${p[1]-5}l5,5l-5,5l-5,-5Z`,fill:color},svg);else el('circle',{cx:p[0],cy:p[1],r:4,fill:color},svg);el('text',{x:p[0]+9,y:p[1]-9},svg,label);return p;}
  if(kind==='spin'){
   mark(data.spin,'var(--viz-series-1)','A/B','circle');mark(data.spin.map(x=>-x),'var(--viz-series-2)','C','diamond');
  }else{
   const start=mark(data.mix,'var(--viz-series-1)','A/B','circle');
   if(Math.hypot(...data.dm)>.001){const end=project(data.mix.map((x,i)=>x+.5*data.dm[i]));el('line',{x1:start[0],y1:start[1],x2:end[0],y2:end[1],stroke:'var(--viz-series-3)','stroke-width':3},svg);const dx=end[0]-start[0],dy=end[1]-start[1],len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;el('path',{d:`M${end[0]},${end[1]} L${end[0]-7*ux+4*uy},${end[1]-7*uy-4*ux} L${end[0]-7*ux-4*uy},${end[1]-7*uy+4*ux} Z`,fill:'var(--viz-series-3)'},svg);}
  }
 }
 function draw(){const d=datasets[Number(select.value)];sphere(root.querySelector('#op5-spin'),'spin',d);sphere(root.querySelector('#op5-mix'),'mix',d);
  root.querySelector('#op5-mix-detail').textContent=select.value==='0'?'Fehlende Mischungsänderung ≈ 0':'Fehlende y-Änderung: −0,775 / Modellzeit · Pfeil × 0,5';
  const labels=['Phase entlang des Zustands','Spindrehung bei festem Boost','Außerhalb des festen Boost-Unterraums'];const bars=root.querySelector('#op5-bars');bars.replaceChildren();
  labels.forEach((label,i)=>{const row=document.createElement('div');row.className='op5-row';const header=document.createElement('div');header.className='op5-bar-label';const l=document.createElement('span');l.textContent=label;const val=document.createElement('span');val.className='tabular-nums';val.textContent=d.parts[i].toLocaleString('de-DE',{maximumFractionDigits:2})+' %';header.append(l,val);const track=document.createElement('div');track.className='op5-track';const fill=document.createElement('div');fill.className='op5-fill';fill.style.width=d.parts[i]+'%';track.append(fill);row.append(header,track);bars.append(row);});
 }
 select.addEventListener('change',draw);new ResizeObserver(draw).observe(root.querySelector('.op5-spheres'));draw();
})();
</script>
