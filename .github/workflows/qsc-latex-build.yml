name: QSC LaTeX PDF Build

on:
  workflow_dispatch:
    inputs:
      source_dir:
        description: "Directory containing canonical TEX sources"
        required: false
        default: "sources"
      build_historical:
        description: "Build historical witness files as well"
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - "sources/**"
      - ".github/scripts/qsc_latex_build.py"
      - ".github/scripts/qsc_research_gate.py"
      - ".github/workflows/qsc-latex-build.yml"

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SOURCE_DIR: ${{ github.event.inputs.source_dir || 'sources' }}
  BUILD_HISTORICAL: ${{ github.event.inputs.build_historical || 'true' }}

concurrency:
  group: qsc-latex-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-pdfs:
    name: Build QSC preview PDFs
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/moriarty1982/quantumsphere-unfold/qsc-latex:latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build preview PDFs
        continue-on-error: true
        run: |
          python3 .github/scripts/qsc_latex_build.py \
            --source-dir "$SOURCE_DIR" \
            --output-dir "$GITHUB_WORKSPACE/build/qsc-pdf-artifacts" \
            --build-historical "$BUILD_HISTORICAL"

      # The v4.9.0 research candidate lives one level below sources/ and is not
      # selected by the step above. Build it separately unless it was already
      # the chosen source directory.
      - name: Build research candidate PDF
        if: env.SOURCE_DIR != 'sources/research'
        continue-on-error: true
        run: |
          python3 .github/scripts/qsc_latex_build.py \
            --source-dir sources/research \
            --output-dir "$GITHUB_WORKSPACE/build/qsc-pdf-artifacts/research" \
            --build-historical false

      - name: Upload QSC preview PDFs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsc-pdf-artifacts-${{ github.ref_name }}-${{ github.run_number }}
          path: build/qsc-pdf-artifacts
          if-no-files-found: warn
          retention-days: 30

      # The build steps continue on error so that previews are always uploaded.
      # This check makes a broken research-candidate build fail the job.
      - name: Check research candidate build
        if: always()
        run: |
          python3 .github/scripts/qsc_research_gate.py \
            "$GITHUB_WORKSPACE/build/qsc-pdf-artifacts/research/build-summary.json" \
            "$GITHUB_WORKSPACE/build/qsc-pdf-artifacts/build-summary.json"
