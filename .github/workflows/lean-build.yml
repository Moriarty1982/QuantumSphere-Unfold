name: Lean build (formal/)

# Builds the Lean formalisation in formal/ with Mathlib from the cache and fails on any `sorry`,
# `admit` or `native_decide`. Runs on every pull request and push to main that touches formal/.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "formal/**"
      - ".github/workflows/lean-build.yml"
  push:
    branches:
      - main
    paths:
      - "formal/**"
      - ".github/workflows/lean-build.yml"

permissions:
  contents: read

concurrency:
  group: lean-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: lake build (Mathlib cache)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: No sorry, admit or native_decide in the sources
        run: |
          if grep -rnE '\b(sorry|admit|native_decide)\b' formal/QSFormal formal/QSFormal.lean; then
            echo "::error::forbidden proof escape found"; exit 1
          fi

      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: lake build
        working-directory: formal
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
          if grep -q "declaration uses 'sorry'" build.log; then
            echo "::error::a declaration uses sorry"; exit 1
          fi

      - name: Axioms of the main statements
        working-directory: formal
        run: |
          cat > AxiomCheck.lean <<'EOF'
          import QSFormal
          #print axioms QSFormal.Dixon.inv_iff
          #print axioms QSFormal.Dixon.tC_JB
          #print axioms QSFormal.Dixon.r26_linear_in_e2
          #print axioms QSFormal.Dixon.r32_linear_in_e3
          #print axioms QSFormal.Lesarten.jB_clock
          #print axioms QSFormal.Lesarten.d4_length
          #print axioms QSFormal.Lesarten.gram_left
          #print axioms QSFormal.Lesarten.lagrange8
          EOF
          lake env lean AxiomCheck.lean | tee axioms.log
          if grep -qE "sorryAx|ofReduceBool" axioms.log; then
            echo "::error::non-standard axiom in a main statement"; exit 1
          fi
