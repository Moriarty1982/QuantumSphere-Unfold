name: Zenodo v5 verified candidate

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful paired-document workflow run
        required: true
      expected_commit:
        description: Exact reviewed source commit (full SHA)
        required: true
      deposition_id:
        description: Existing unpublished Zenodo draft
        required: true
        default: '24152615'
      dry_run:
        type: boolean
        default: true
      publish:
        type: boolean
        default: false
      confirm_publish:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve the exact successful paired build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          mkdir -p build
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > build/source-run.json
          python - <<'PY'
          import json, os, pathlib
          run = json.loads(pathlib.Path('build/source-run.json').read_text())
          assert run['head_sha'] == os.environ['EXPECTED_COMMIT'], 'Wrong source commit'
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Build not successful'
          assert run['path'] == '.github/workflows/qsc-v5-dual-documents.yml', 'Wrong workflow'
          pathlib.Path('build/artifact-name.txt').write_text('qsc-v5-paired-documents-' + str(run['run_number']))
          PY
          gh run download "$SOURCE_RUN" --name "$(cat build/artifact-name.txt)" --dir build/v5-bundle
      - name: Verify and package English documents
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          python -m pip install -r qam/store/requirements.txt
          python -m qam.tools.package_v5_documents --bundle build/v5-bundle --out build/v5-upload --expected-commit "$EXPECTED_COMMIT"
      - name: Validate or upload the existing draft
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          DEPOSITION_ID: ${{ inputs.deposition_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH: ${{ inputs.publish }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--metadata release/zenodo/metadata_v5_0_0.json --files 'build/v5-upload/*'
                --environment production --deposition-id "$DEPOSITION_ID" --replace-files
                --default-preview Quantum_Sphaera_Companion_v5_0_0_full.pdf)
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          if [[ "$PUBLISH" == true ]]; then
            test "$CONFIRM_PUBLISH" = true
            args+=(--publish --confirm-publish)
          fi
          python tools/zenodo_publish.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qsc-v5-zenodo-payload-${{ github.run_number }}
          path: build/v5-upload
          if-no-files-found: error
          retention-days: 30
