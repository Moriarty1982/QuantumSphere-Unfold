name: Zenodo v5 verified candidate

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful paired-document workflow run
        required: true
      expected_commit:
        description: Exact reviewed source commit (full SHA)
        required: true
      deposition_id:
        description: Existing unpublished Zenodo draft
        required: true
        default: '24152615'
      dry_run:
        type: boolean
        default: true
      publish:
        type: boolean
        default: false
      confirm_publish:
        type: boolean
        default: false
      verify_only:
        description: Verify the existing uploaded draft without uploading again
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve the exact successful paired build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          mkdir -p build
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > build/source-run.json
          python - <<'PY'
          import json, os, pathlib
          run = json.loads(pathlib.Path('build/source-run.json').read_text())
          assert run['head_sha'] == os.environ['EXPECTED_COMMIT'], 'Wrong source commit'
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Build not successful'
          assert run['path'] == '.github/workflows/qsc-v5-dual-documents.yml', 'Wrong workflow'
          pathlib.Path('build/artifact-name.txt').write_text('qsc-v5-paired-documents-' + str(run['run_number']))
          PY
          gh run download "$SOURCE_RUN" --name "$(cat build/artifact-name.txt)" --dir build/v5-bundle
      - name: Verify and package English documents
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          python -m pip install -r qam/store/requirements.txt
          python -m qam.tools.package_v5_documents --bundle build/v5-bundle --out build/v5-upload --expected-commit "$EXPECTED_COMMIT"
      - name: Validate or upload the existing draft
        if: ${{ !inputs.verify_only }}
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          DEPOSITION_ID: ${{ inputs.deposition_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH: ${{ inputs.publish }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--metadata release/zenodo/metadata_v5_0_0.json --files 'build/v5-upload/*'
                --environment production --deposition-id "$DEPOSITION_ID" --replace-files
                --default-preview Quantum_Sphaera_Companion_v5_0_0_full.pdf)
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          if [[ "$PUBLISH" == true ]]; then
            test "$CONFIRM_PUBLISH" = true
            args+=(--publish --confirm-publish)
          fi
          python tools/zenodo_publish.py "${args[@]}"
      - name: Verify uploaded draft files and preview
        if: ${{ !inputs.dry_run && !inputs.publish }}
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          DEPOSITION_ID: ${{ inputs.deposition_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          from tools.zenodo_publish import request_json, ZENODO_API, reserved_doi
          token = os.environ['ZENODO_TOKEN']
          identifier = os.environ['DEPOSITION_ID']
          dep = request_json('GET', f'{ZENODO_API}/deposit/depositions/{identifier}', token)
          assert not dep.get('submitted'), 'Expected an unpublished draft'
          assert reserved_doi(dep) == '10.5281/zenodo.24152615', 'Wrong reserved DOI'
          assert dep['metadata']['version'] == 'v5.0.0', 'Wrong metadata version'
          expected = {p.name: hashlib.md5(p.read_bytes()).hexdigest()
                      for p in Path('build/v5-upload').iterdir() if p.is_file()}
          actual = {f['filename']: f['checksum'].removeprefix('md5:') for f in dep['files']}
          assert expected == actual, 'Remote file coverage or checksums differ'
          request = urllib.request.Request(f'{ZENODO_API}/records/{identifier}/draft', headers={
              'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.inveniordm.v1+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              record = json.load(response)
          preview = record.get('files', {}).get('default_preview')
          assert preview == 'Quantum_Sphaera_Companion_v5_0_0_full.pdf', 'Wrong or unset preview'
          report = {'deposition_id': identifier, 'published': False, 'files_verified': len(expected),
                    'checksums': actual, 'default_preview': preview,
                    'draft_url': record.get('links', {}).get('self_html')}
          Path('build/v5-upload-verification.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.dry_run && !inputs.publish }}
        with:
          name: qsc-v5-zenodo-verification-${{ github.run_number }}
          path: build/v5-upload-verification.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qsc-v5-zenodo-payload-${{ github.run_number }}
          path: build/v5-upload
          if-no-files-found: error
          retention-days: 30
