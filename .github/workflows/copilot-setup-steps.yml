# Environment for the GitHub Copilot coding agent.
# Copilot runs these steps before it starts working on an assigned issue.
# The job name must stay "copilot-setup-steps". The workflow can also be run by hand to test the setup.
name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Same TeX packages as docker/latex/Dockerfile, plus German babel for the German preprint.
      - name: Install TeX Live and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ghostscript latexmk poppler-utils \
            texlive-bibtex-extra texlive-extra-utils texlive-fonts-recommended \
            texlive-lang-german texlive-latex-base texlive-latex-extra \
            texlive-latex-recommended texlive-pictures texlive-science

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r qam/store/requirements.txt pypdf pyyaml

      - name: Check the toolchain
        run: |
          pdflatex --version | head -1
          python -c "import sqlalchemy, pypdf; print('python deps ok')"
          python tools/qs.py --help > /dev/null && echo "qs.py ok"
