name: QAM batch checks

on:
  workflow_dispatch:
  pull_request:
    paths: ["qam/**", "scripts/qsc_audit/**", ".gitattributes", ".github/workflows/qam-batch.yml"]
  push:
    branches: [main]
    paths: ["qam/**", "scripts/qsc_audit/**", ".gitattributes", ".github/workflows/qam-batch.yml"]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/qsc_audit/tests -p test_qam_pair_batch.py
      - run: python -m unittest discover -s scripts/qsc_audit/tests -p test_framework_interface.py
      - run: python -m unittest qam.tools.test_tape_machine
      - name: Install statement-store dependencies
        run: python -m pip install -r qam/store/requirements.txt
      - name: Check statement store and document editions
        run: python -m unittest discover -s qam/store -p "test_*.py"
      - name: Compare both tape controllers against MMA
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          python -m qam.examples.zuse_machine.hdl.check
          python -m unittest qam.tools.test_receipt_context
          python -m qam.examples.zuse_machine.hdl.guard_stream_check --rows 4096
          python -m pip install mcp==2.3.0
          python mcp/check_hdl_stdio.py

  coprocessor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install iverilog, Yosys and Qiskit
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
          python -m pip install "qiskit>=2,<3" qiskit-qasm3-import
      - name: All HDL blocks synthesize with Yosys
        run: python -m qam.examples.coprocessor.synth_check
      - name: Coprocessor core against exact reference and Qiskit
        run: python -m qam.examples.coprocessor.check --cases 500 --seed 1
      - name: Bridge to OpenQASM, Qiskit and Wolfram
        run: python -m qam.examples.coprocessor.bridge_check --cases 300 --seed 7
      - name: Boot monitor runs portable program images
        run: python -m qam.examples.coprocessor.qimage --cases 600 --seed 3
      - name: Pipelined core with several contexts
        run: python -m qam.examples.coprocessor.pipe_check --cases 600 --seed 5
      - name: Partitionable band register
        run: python -m qam.examples.coprocessor.band_check --steps 6000 --seed 11
      - name: Parallel compute units per band
        run: python -m qam.examples.coprocessor.lanes_check --cases 1200 --seed 9
      - name: Self-monitoring (norm watchdog halts on violation)
        run: python -m qam.examples.coprocessor.monitor_check --cases 800 --seed 13
