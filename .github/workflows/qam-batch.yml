name: QAM batch checks

on:
  workflow_dispatch:
  pull_request:
    paths: ["qam/**", "scripts/qsc_audit/**", ".github/workflows/qam-batch.yml"]
  push:
    branches: [main]
    paths: ["qam/**", "scripts/qsc_audit/**", ".github/workflows/qam-batch.yml"]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/qsc_audit/tests -p test_qam_pair_batch.py
      - run: python -m unittest discover -s scripts/qsc_audit/tests -p test_framework_interface.py
