name: QAM TeX checks

# Runs the tests of qam/tex/qam.sty: pass*.tex must compile, fail*.tex must stop with a qam error.
on:
  workflow_dispatch:
  pull_request:
    paths: ["qam/**", ".github/workflows/qam-tex.yml"]
  push:
    branches: [main]
    paths: ["qam/**", ".github/workflows/qam-tex.yml"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: qam
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-fonts-recommended >/dev/null
      - run: sh qam/tex/tests/run_tests.sh
      - name: Exported records are up to date
        run: |
          cd qam/examples
          for f in example bad_promotion bad_frame bad_independent bad_map_source; do
            cp $f.qam /tmp/$f.qam
            TEXINPUTS=../tex: pdflatex -interaction=nonstopmode -halt-on-error $f.tex >/dev/null
            diff -u /tmp/$f.qam $f.qam
          done
