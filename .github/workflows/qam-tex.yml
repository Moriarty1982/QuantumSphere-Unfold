name: QAM TeX checks

# Runs the tests of qam/tex/qam.sty: pass*.tex must compile, fail*.tex must stop with a qam error.
on:
  workflow_dispatch:
  pull_request:
    paths: ["qam/**", ".github/workflows/qam-tex.yml"]
  push:
    branches: [main]
    paths: ["qam/**", ".github/workflows/qam-tex.yml"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: qam
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-fonts-recommended >/dev/null
      - run: sh qam/tex/tests/run_tests.sh
